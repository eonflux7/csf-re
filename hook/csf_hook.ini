# csf hook config. Directives:
#   disable 0x44FC30        disable one hook
#   disable_module core     disable all hooks of a module
#   only_module core        install only hooks of listed modules
#   windowed 1              force windowed mode (window size = the game's video mode, Settings > resolution)
#   cmdline -scene NAME     override Juego.cfg .commandLine (dev switches: -scene NAME, -log, -instance)
#   autopilot MS key KEY    scripted key press at MS after load (DIK name: ESCAPE RETURN UP ... or 0xNN)
