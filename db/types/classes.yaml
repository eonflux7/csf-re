# Class names (Phase 2). Source of truth for src/types/auto_classes.h (tools/gen_classes_h.py), the rename pass
# (tools/rename_classes.py) and the IDB sync. Keys are primary vtable addresses (db/classes.json).
#   name      C* class, T* AI task/state (the game's own convention, see 0x8442A0's type registry: CVector3, SRect,
#             CInterpolatorHermite3D; AI classes return their T* names from a GetName virtual), Net* = NetZ DDL class.
#   attested  true: the name itself is in the binary (type-name string). false: our descriptive name for the role.
#   conf      confidence in the role. Only conf >= 0.7 is applied to code (rename pass, IDB).
#   why       the evidence.
#   fields    {offset: name} for scalar fields (renames field_XXXX in generated structs and src/auto).
#   note      layout facts not expressed as fields yet.

