# Class names (Phase 2). Source of truth for src/types/auto_classes.h (tools/gen_classes_h.py), the rename pass
# (tools/rename_classes.py) and the IDB sync. Keys are primary vtable addresses (db/classes.json).
#   name      C* class, T* AI task/state (the game's own convention, see 0x8442A0's type registry: CVector3, SRect,
#             CInterpolatorHermite3D; AI classes return their T* names from a GetName virtual), Net* = NetZ DDL class.
#   attested  true: the name itself is in the binary (type-name string). false: our descriptive name for the role.
#   conf      confidence in the role. Only conf >= 0.7 is applied to code (rename pass, IDB).
#   why       the evidence.
#   fields    {offset: name} for scalar fields (renames field_XXXX in generated structs and src/auto).
#   note      layout facts not expressed as fields yet.

# ---- GUI (.fbs menus). Parser 0x71DBE0 maps control keywords to CGuiBuilder vtable slots +0x18..+0x44.
"00864b30": {name: CGuiBuilder, attested: false, conf: 0.8, why: "owns the per-keyword control factories (slots +0x18..+0x44) dispatched by the .fbs parser 0x71DBE0"}
"00864288":
  name: CGuiControl
  attested: false
  conf: 0.9
  why: "common base of all 12 control types; ctor 0x71A010, dtor 0x719B10, reset 0x718CC0"
  note: >-
    Setters traced from the .fbs reader 0x71EBD0 (keyword -> vtable slot -> field). Slot +0x138 = SendEvent(id)
    (-> +0x218 FireEvent: listeners, then parent). +0x0C creates quads/fonts (builder's +4); +0x10 = &builder+0xC.
    +0xFC is a VC7.1 std::vector<listener*> (allocator word, then begin/end/cap). Effects at +0x128 are a linked list
    (next = vslot +0x10) made by 0x713B20(type): 0 QUAD_VARIABLE, 1 QUAD_BACKGROUND, 3 QUAD_FOCUS,
    4 QUAD_BLINKING_FOCUS, 5 QUAD_SELECTED. Anim pairs (elapsed float, interpolator*) fire events 9/10 (pos),
    11/12 (size). sizeof 0x134 (first derived field at +0x134).
  fields:
    "000c": m_pRenderer
    "0014": m_bShown
    "0018": legacy::string m_id
    "0034": legacy::string m_idLeft
    "0050": legacy::string m_idRight
