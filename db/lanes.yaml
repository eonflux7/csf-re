# Model policy of the grunt lanes (tools/grunt.py lanes / wave). One place; `--config FILE` runs another one.
# Tiers by original size in bytes: S < s_max (and clone siblings with a done example up to m_max), M <= m_max,
# L <= l_max, X the rest. A ladder is backend:model[@effort]:attempts, tried in order.

s_max: 150
m_max: 400
l_max: 600

# S, 2026-10-08 (473 results): Haiku low wrote 289 of 330 passes, the strong rung 28; Haiku medium dropped.
s_ladder: claude:claude-haiku-5-5@low:2,codex:gpt-6.1-sol@high:1
# M, 2026-10-09 (198 results): Haiku high wrote 3 of 189 passes in 267 calls; Codex first, Opus to escalate.
m_ladder: codex:gpt-6.1-sol@high:2,claude:claude-opus-5-5@high:1
l_ladder: codex:gpt-6.1-sol@high:2
# X, 2026-10-09: Opus first took the grunts' 5h window from 21% to 78% in one wave; Codex writes, Opus escalates.
x_ladder: codex:gpt-6.1-sol@high:2,claude:claude-opus-5-5@high:1
hub_callers: 25        # called from >= N functions of other modules: the L ladder (0: off)

# functions in flight per tier
s_jobs: 12
m_jobs: 6
l_jobs: 3
x_jobs: 2

# in-lane review: Codex reads gate-passed Claude answers above N bytes (-1: off)
review_over: 150
review_effort: medium

# quota guards (% of the 5h window; 0: off) and stand-ins
codex_cap: 90          # pause Codex
claude_cap: 95         # pause the grunts' Claude account (5h or 7d window)
codex_reserve: 50      # from here S/M Codex rungs run on codex_sub (Codex kept for L)
codex_sub: claude:claude-sonnet-5-5@medium
# while the grunts' Claude account is paused: Claude rung model=Codex model standing in (unlisted rungs are skipped)
claude_sub: claude-haiku-5-5@low=gpt-6.1-sol@low,claude-haiku-5-5@high=gpt-6.1-sol@medium
claude_sub_login: codex-2
